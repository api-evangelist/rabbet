name: Rabbet
description: >-
  Rabbet (Renovate Simply, Inc.) is an Austin-based construction finance software
  company backed by QED Investors. It provides two products: a platform for real
  estate developers to manage construction budgets, draw packaging, and project
  documents, and a platform for construction lenders to standardize borrower
  submissions and manage construction loans with compliance controls. Rabbet
  operates a Public API (tracked on its status page) exposed through custom-scoped
  enterprise integrations that sync loan, funding, and project data with core
  banking systems (Fiserv, Finastra, FIS, Jack Henry), loan origination systems
  (nCino, MeridianLink, Encompass), and BI/data-warehouse tools (Power BI, Tableau,
  Looker, Amazon). API access is arranged through a scoping engagement rather than
  a self-service developer portal.
